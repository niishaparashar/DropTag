<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">DropTag</title>
  <desc id="desc">Green rounded square with a black hashtag-style mark and a white accent dot.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#22c55e" flood-opacity="0.35" />
    </filter>
  </defs>
  <rect x="4" y="4" width="56" height="56" rx="16" fill="#22c55e" filter="url(#shadow)" />
  <rect x="11" y="11" width="42" height="42" rx="10" fill="none" stroke="#000000" stroke-opacity="0.2" stroke-width="2" />
  <rect x="16" y="25" width="16" height="3" rx="1.5" fill="#000000" />
  <rect x="32" y="25" width="16" height="3" rx="1.5" fill="#000000" />
  <rect x="25" y="16" width="3" height="16" rx="1.5" fill="#000000" />
  <rect x="25" y="32" width="3" height="16" rx="1.5" fill="#000000" />
  <circle cx="43" cy="21" r="4" fill="#ffffff" fill-opacity="0.9" />
</svg>